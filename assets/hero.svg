<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Atharva Vichare, GenAI and ML engineer">
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .glow-a { animation: drift 9s ease-in-out infinite alternate; }
    .glow-b { animation: drift 11s ease-in-out infinite alternate-reverse; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 72px 312px; }
    .orbit1 { animation: spin 18s linear infinite; transform-origin: 950px 190px; }
    .orbit2 { animation: spin 30s linear infinite reverse; transform-origin: 950px 190px; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes drift { from { transform: translate(0,0); opacity: .55; } to { transform: translate(40px,-20px); opacity: .9; } }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.8); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="380" rx="24"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="fade" cx="75%" cy="50%" r="70%">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1200" height="380" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B9A8FF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity=".9"/><stop offset="1" stop-color="#22D3EE" stop-opacity=".15"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#0A0B10"/>
    <circle class="glow-a" cx="260" cy="60" r="170" fill="#7C5CFF" filter="url(#blur)"/>
    <circle class="glow-b" cx="1020" cy="330" r="160" fill="#22D3EE" fill-opacity=".45" filter="url(#blur)"/>
    <rect width="1200" height="380" fill="url(#grid)" mask="url(#gridmask)"/>

    <g fill="none" stroke="url(#ring)">
      <circle cx="950" cy="190" r="170" stroke-opacity=".35"/>
      <circle cx="950" cy="190" r="115" stroke-opacity=".5"/>
      <circle cx="950" cy="190" r="60" stroke-opacity=".7"/>
    </g>
    <circle cx="950" cy="190" r="22" fill="#7C5CFF" opacity=".25"/>
    <circle cx="950" cy="190" r="9" fill="#E9E4FF"/>
    <g class="orbit1"><circle cx="1065" cy="190" r="6" fill="#22D3EE"/></g>
    <g class="orbit2"><circle cx="950" cy="20" r="5" fill="#B9A8FF"/><circle cx="1010" cy="190" r="3.5" fill="#fff"/></g>

    <text x="64" y="104" class="mono" font-size="18" fill="#8B8FA3">~/atty57<tspan fill="#7C5CFF"> $ </tspan>whoami</text>
    <text x="62" y="182" class="sans" font-size="68" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Atharva Vichare</text>
    <text x="64" y="228" class="sans" font-size="24" fill="#A1A6B8">GenAI / ML Engineer · agents, RAG &amp; open source</text>

    <rect x="52" y="292" width="540" height="40" rx="20" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/>
    <circle class="pulse" cx="72" cy="312" r="5" fill="#2EE59D"/>
    <text x="88" y="318" class="mono" font-size="15" fill="#D6D8E1">now shipping → moonlight v0.1 · agent-framework PRs<tspan class="caret" fill="#7C5CFF"> ▍</tspan></text>
  </g>
</svg>
