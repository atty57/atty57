<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Moonlight: give your leftover AI usage a night job">
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.3s; }
    .halo { animation: breathe 6s ease-in-out infinite; transform-origin: 1000px 150px; }
    @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes breathe { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .6; transform: scale(1.08); } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <mask id="crescent">
      <circle cx="1000" cy="150" r="74" fill="#fff"/>
      <circle cx="1034" cy="126" r="66" fill="#000"/>
    </mask>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F1FF"/><stop offset="1" stop-color="#B9A8FF"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0B0A18"/>
    <circle cx="1000" cy="150" r="150" fill="#7C5CFF" filter="url(#blur)" class="halo"/>

    <g fill="#fff">
      <circle class="star" cx="840" cy="60" r="2"/>
      <circle class="star s2" cx="1150" cy="70" r="1.6"/>
      <circle class="star s3" cx="880" cy="240" r="1.8"/>
      <circle class="star s4" cx="1120" cy="245" r="2.2"/>
      <circle class="star s2" cx="760" cy="150" r="1.4"/>
      <circle class="star s3" cx="1180" cy="160" r="1.4"/>
    </g>
    <rect x="900" y="50" width="200" height="200" fill="url(#moon)" mask="url(#crescent)"/>

    <text x="64" y="84" class="mono" font-size="15" letter-spacing="2" fill="#B9A8FF">FEATURED PROJECT · CLAUDE CODE PLUGIN</text>
    <text x="62" y="148" class="sans" font-size="56" font-weight="700" letter-spacing="-1" fill="#F4F1FF">Moonlight</text>
    <text x="64" y="190" class="sans" font-size="24" fill="#A9A6C4">Give your leftover AI usage a night job.</text>

    <rect x="52" y="222" width="470" height="40" rx="10" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".1"/>
    <text x="72" y="248" class="mono" font-size="16" fill="#D6D8E1"><tspan fill="#7C5CFF">$</tspan> /plugin install moonlight@moonlight</text>
  </g>
</svg>
